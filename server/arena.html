<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillMe Arena</title>
<link rel="icon" href="/assets/sprites/icon-player.png">
<style>
/* =======================================================================
   Art: assets/sprites/*.png, cut from the generated sheets in assets/atlas by scripts/build-atlas.js.
   Frames are stretched with border-image (9-slice), so their decorated corners never distort.
   Themes: Night (light-brown windows, night battlefield, deep brown page) and Day (parchment windows, day battlefield).
   The navy UI art is recoloured to light brown by the build (the *-warm sprites), so panels carry dark brown text.
   ======================================================================= */
:root {
  --page: radial-gradient(ellipse at top, #3a2a14 0%, #1d1409 70%);
  --win-img: url(/assets/sprites/frame-window-day.png); --win-slice: 46; --bg-img: url(/assets/sprites/bg-day.png);
  --text: #3a240e; --muted: #7a5a36;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: radial-gradient(ellipse at top, #3a2a18 0%, #120c06 70%);
    --win-img: url(/assets/sprites/frame-window-warm.png); --bg-img: url(/assets/sprites/bg-night.png);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: radial-gradient(ellipse at top, #3a2a18 0%, #120c06 70%);
  --win-img: url(/assets/sprites/frame-window-warm.png); --bg-img: url(/assets/sprites/bg-night.png);
  color-scheme: dark;
}
/* The light-brown art (dialog box, plates, rows, chips) carries dark brown text, whatever the theme. */
.night { --text: #3a240e; --muted: #7a5a36; color: var(--text); }
/* Green and red rows (right / wrong) keep light text. */
.opt.right, .opt.wrong, .verdict.good, .verdict.bad, .note.won { --text: #ffffff; --muted: #eef3e2; color: var(--text); }
:root { --gold: #ffd24a; --gold2: #c8901c; --good: #6fe36f; --bad: #ff7a6a; --warn: #ffd24a; --human: #6cc8ff; --ai: #ffa05c;
  --font-ui: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; --outline: #1d1206;
  --accent: #9a4a0c; } /* --accent: labels and links on the light-brown panels */

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; overflow-x: hidden; }
body { background: var(--page); background-attachment: fixed; min-height: 100vh; color: var(--text); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
code, pre, .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }
img { -webkit-user-drag: none; user-select: none; }
.wrap { max-width: 880px; margin: 0 auto; padding: 12px 16px 28px; }
.ui { font-family: var(--font-ui); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.outline { text-shadow: 2px 0 var(--outline), -2px 0 var(--outline), 0 2px var(--outline), 0 -2px var(--outline), 2px 2px var(--outline), -2px -2px var(--outline), 2px -2px var(--outline), -2px 2px var(--outline); }
.ic { width: 20px; height: 20px; object-fit: contain; flex: none; vertical-align: middle; }
.ic.s { width: 16px; height: 16px; } .ic.l { width: 28px; height: 28px; } .ic.xl { width: 40px; height: 40px; }

/* ---------- frames (9-slice) */
.win { border: 16px solid transparent; border-image: var(--win-img) var(--win-slice) fill / 16px stretch; color: var(--text); filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
.dialog { border: 20px solid transparent; border-image: url(/assets/sprites/frame-dialog-warm.png) 56 fill / 20px stretch; filter: drop-shadow(0 6px 8px rgba(0,0,0,.4)); }
.plate { border-style: solid; border-color: transparent; border-width: 11px 18px; border-image: url(/assets/sprites/frame-plate-warm.png) 30 50 fill / 11px 18px stretch; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 0 2px; border-style: solid; border-color: transparent; border-width: 7px 10px;
  border-image: url(/assets/sprites/frame-chip-warm.png) 32 42 fill / 7px 10px stretch; color: var(--muted); line-height: 1.1; }
.chip .ic { width: 16px; height: 16px; }
.chip.concept { color: var(--text); } .chip.queue { color: #a35400; }
.chip.mono { text-transform: none; letter-spacing: 0; font-family: ui-monospace, Consolas, monospace; font-weight: 600; }

/* ---------- header: crest, status strip (level, streak, accuracy, badges), tools */
header.top { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin: 2px 0 12px; position: relative; }
.crest { display: flex; align-items: center; gap: 8px; font-size: 19px; color: #fff; }
.crest img { width: 44px; height: 44px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
.strip { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; color: #fff; order: 3; flex-basis: 100%; } /* its own row under the crest and buttons */
.strip .item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 14px; }
.strip .item img { width: 26px; height: 26px; object-fit: contain; }
.lvl { display: inline-grid !important; grid-template-columns: auto auto; column-gap: 4px; align-items: center; }
.lvl img { grid-row: 1 / 3; width: 34px !important; height: 34px !important; }
.lvl .xp { width: 64px; height: 12px; border-style: solid; border-color: transparent; border-width: 3px 5px; border-image: url(/assets/sprites/bar-trough-warm.png) 30 34 fill / 3px 5px stretch; position: relative; }
.lvl .xp i { position: absolute; left: 0; top: 0; bottom: 0; border-style: solid; border-color: transparent; border-width: 3px 4px; border-image: url(/assets/sprites/bar-gold-fill.png) 30 40 fill / 3px 4px stretch; min-width: 8px; }
.badges { display: flex; gap: 1px; align-items: center; }
.badges img { width: 30px; height: 30px; object-fit: contain; transition: transform .12s; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
.badges img:hover { transform: translateY(-2px) scale(1.2); }
.badges img.locked { opacity: .55; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: rgba(255,210,74,.2); color: var(--warn); border: 1px solid var(--warn); }
.top .spacer { flex: 1; }
.tools { display: flex; gap: 6px; align-items: center; }
.tbtn { width: 42px; height: 42px; display: inline-grid; place-items: center; position: relative; padding: 0; border: 0; background: url(/assets/sprites/frame-iconbtn-warm.png) center / 100% 100% no-repeat; filter: drop-shadow(0 3px 2px rgba(0,0,0,.4)); transition: transform .08s; }
.tbtn img { width: 24px; height: 24px; object-fit: contain; }
.tbtn svg.look-ic { width: 24px; height: 24px; filter: drop-shadow(0 1px 0 rgba(0,0,0,.25)); }
.tbtn:hover { transform: translateY(-2px); }
.tbtn:active { transform: translateY(1px) scale(.96); }
.tbtn.on { filter: drop-shadow(0 0 5px var(--good)) drop-shadow(0 3px 2px rgba(0,0,0,.4)); }
.tbtn .dot { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; }
select.tsel { height: 38px; border-style: solid; border-color: transparent; border-width: 8px 10px; border-image: url(/assets/sprites/frame-input-warm.png) 34 fill / 8px 10px stretch; background: transparent; color: var(--text); padding: 0 4px; max-width: 200px; font-size: 13px; }
select.tsel option, select.field option { background: #f3e4c8; color: #3a240e; }

/* ---------- battle stage */
.stage { position: relative; overflow: hidden; margin-bottom: 14px; border: 16px solid transparent; border-image: var(--win-img) var(--win-slice) / 16px stretch; filter: drop-shadow(0 6px 8px rgba(0,0,0,.4)); }
.stage .sky { position: absolute; inset: 0; background: var(--bg-img) center 78% / cover no-repeat; }
.arena { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 8px; padding: 14px 18px 12px; min-height: 290px; }
.fighter { display: grid; justify-items: center; gap: 4px; position: relative; z-index: 2; }
.sprite-wrap { position: relative; display: grid; place-items: end center; height: 210px; animation: bob 2.2s ease-in-out infinite; }
.boss .sprite-wrap { animation-delay: -1.1s; }
.hero-sprite { width: 220px; height: 210px; object-fit: contain; object-position: center bottom; } /* the frame leaves room for the sword slash */
.boss-sprite { width: 210px; height: 192px; object-fit: contain; object-position: center bottom; }
.shadow { position: absolute; bottom: -4px; left: 50%; width: 60%; height: 14px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(0,0,0,.45), transparent); z-index: -1; }
.fighter .plate { width: 100%; max-width: 280px; }
.plate .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.boss .plate .row { flex-direction: row-reverse; }
.plate .name { font-size: 12px; }
.plate .pct { font-size: 24px; line-height: 1; }
.human .pct { color: #d6f0ff; } .ai .pct { color: #ffe2cc; }
.bar { position: relative; height: 22px; margin-top: 5px; border-style: solid; border-color: transparent; border-width: 6px 8px; border-image: url(/assets/sprites/bar-trough-warm.png) 30 34 fill / 6px 8px stretch; }
.bar i { position: absolute; top: -2px; bottom: -2px; left: -4px; min-width: 14px; transition: width .9s cubic-bezier(.2,.8,.2,1);
  border-style: solid; border-color: transparent; border-width: 6px 7px; border-image: url(/assets/sprites/bar-blue-fill.png) 25 26 fill / 6px 7px stretch; }
.bar.ai i { border-image-source: url(/assets/sprites/bar-orange-fill.png); left: auto; right: -4px; }
.vsbox { align-self: center; margin-bottom: 90px; z-index: 3; display: grid; place-items: center; }
.vs { width: 74px; height: 76px; animation: pulse 1.8s ease-in-out infinite; filter: drop-shadow(0 3px 3px rgba(0,0,0,.5)); }
.vsbox .btn { animation: pulse 1.4s ease-in-out infinite; white-space: nowrap; }
.plate .hp { display: inline-flex; align-items: baseline; gap: 4px; font-size: 24px; line-height: 1; color: #fff; }
.plate .hp small { font-size: 11px; color: #fff; }
.plate .hp .ic { align-self: center; }
.plate.low { animation: lowhp 1s ease-in-out infinite; }
@keyframes lowhp { 50% { filter: drop-shadow(0 0 10px #ff3b30); } }
.bar .lag { position: absolute; top: -2px; bottom: -2px; left: -4px; border-radius: 9px; background: rgba(255,255,255,.85); transition: width .6s ease .45s; }
.bar.ai .lag { left: auto; right: -4px; }
.bar i { z-index: 1; }
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
@keyframes pulse { 50% { transform: scale(1.1) rotate(-4deg); } }

/* ---------- character animations */
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes attack { 0% { transform: translateX(0); } 30% { transform: translateX(70px) translateY(-8px); } 45% { transform: translateX(62px); } 100% { transform: translateX(0); } }
@keyframes hurt { 0%, 100% { transform: translateX(0); filter: none; } 12% { filter: brightness(2.6) saturate(.3); } 25% { transform: translateX(10px); } 40% { transform: translateX(-10px); filter: none; } 55% { transform: translateX(6px); } 70% { transform: translateX(-3px); } }
@keyframes mad { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-3px, 1px); } 75% { transform: translate(3px, -1px); } }
@keyframes dance { 0%, 100% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(-14px, -22px) rotate(-8deg); } 50% { transform: translate(0, 0) scaleY(.92); } 75% { transform: translate(14px, -22px) rotate(8deg); } }
@keyframes jumpback { 0% { transform: translate(0, 0); } 30% { transform: translate(34px, -40px) rotate(8deg); } 60% { transform: translate(38px, 0); } 100% { transform: translate(0, 0); } }
@keyframes sulk { 0%, 100% { transform: translateY(4px) scaleY(.96); } 50% { transform: translateY(6px) scaleY(.93); } }
@keyframes victory { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-34px); } }
@keyframes glow { 0%, 100% { filter: drop-shadow(0 0 0 transparent); } 50% { filter: drop-shadow(0 0 16px var(--gold)) brightness(1.2); } }
.hero.attack .sprite-wrap { animation: attack .62s ease-out; }
.hero.flinch .sprite-wrap { animation: hurt .6s; }
.hero.victory .sprite-wrap { animation: victory .55s ease-out 2; }
.hero.levelup .sprite-wrap { animation: glow .55s ease-in-out 4; }
.boss.hurt .sprite-wrap { animation: hurt .55s; }
.boss.mad .sprite-wrap { animation: mad .1s steps(2) infinite; }
.boss.dance .sprite-wrap { animation: dance .55s ease-in-out 4; }
.boss.shock .sprite-wrap { animation: jumpback .7s ease-out; }
.boss.sulk .sprite-wrap { animation: sulk 1s ease-in-out 2; }
@keyframes charge { 0% { transform: translateX(0); } 35% { transform: translateX(-90px) translateY(-8px) rotate(-6deg); } 50% { transform: translateX(-80px); } 100% { transform: translateX(0); } }
.boss.charge .sprite-wrap { animation: charge .7s ease-out; }
.fighter.down .sprite-wrap { animation: none; }
.hero.fallen .hero-sprite { transform: rotate(-80deg) translate(10px, -20px); transform-origin: 50% 90%; filter: saturate(.4) brightness(.85); transition: transform .45s ease-in; }
.boss.fallen .boss-sprite { transform: rotate(84deg); transform-origin: 50% 90%; filter: saturate(.4) brightness(.85); transition: transform .45s ease-in; }

/* ---------- particles and floating numbers */
.pt { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; object-fit: contain; animation: float 1.4s ease-out forwards; }
.pt.big { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
@keyframes float { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx, 0), var(--dy, -60px)) scale(1) rotate(var(--r, 0)); opacity: 0; } }
.pt.tune { animation: tune 1.6s ease-out forwards; }
@keyframes tune { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 50% { transform: translate(calc(var(--dx) * .5 - 8px), calc(var(--dy) * .5)) rotate(-18deg); } 100% { transform: translate(var(--dx), var(--dy)) rotate(18deg); opacity: 0; } }
.pt.pop { animation: popfx .7s ease-out forwards; }
@keyframes popfx { 0% { transform: scale(.2); opacity: 1; } 60% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
.ftext { position: absolute; transform: translate(-50%, 0); font-size: 22px; white-space: nowrap; animation: rise 1.3s ease-out forwards; }
.ftext.gold { color: var(--gold); } .ftext.blue { color: #d6f0ff; } .ftext.red { color: #ffc0b0; }
.ftext.dmg { color: #ff5a4a; font-size: 34px; }
.ftext.crit { color: var(--gold); font-size: 18px; margin-top: -30px; }
@keyframes rise { 0% { transform: translate(-50%, 8px) scale(.6); opacity: 0; } 20% { transform: translate(-50%, 0) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -60px) scale(1); opacity: 0; } }

/* ---------- quiz dialog */
.card { position: relative; padding: 6px 8px; }
.card::before, .card::after { content: ''; position: absolute; top: -26px; width: 46px; height: 46px; background: url(/assets/sprites/corner.png) center / contain no-repeat; pointer-events: none; }
.card::before { left: -26px; } .card::after { right: -26px; transform: scaleX(-1); }
.qhead { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.stars { display: inline-flex; gap: 0; }
.stars img { width: 16px; height: 16px; }
.timer { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.timer .bar { width: 76px; height: 16px; margin: 0; border-width: 4px 6px; border-image-width: 4px 6px; }
.timer .bar i { top: -1px; bottom: -1px; left: -3px; border-width: 4px 5px; border-image: url(/assets/sprites/bar-gold-fill.png) 30 40 fill / 4px 5px stretch; min-width: 10px; transition: width .25s linear; }
.context { border-style: solid; border-color: transparent; border-width: 10px 12px; border-image: url(/assets/sprites/frame-input-warm.png) 34 fill / 10px 12px stretch; padding: 2px 4px; margin: 0 0 12px; font-size: 14px; }
.context b { font-size: 11px; color: var(--accent); display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.question { font-size: 19px; font-weight: 800; line-height: 1.4; margin: 2px 2px 12px; }
pre.code { background: #221a12; color: #f1e6d6; padding: 12px 14px; border-radius: 8px; border: 2px solid #8a6238; overflow-x: auto; font-size: 13px; line-height: 1.55; margin: 0 0 14px; }
.tk-c { color: #7c8aa5; font-style: italic; } .tk-s { color: #a5e3a1; } .tk-k { color: #c4a7ff; } .tk-n { color: #fdba74; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; display: flex; gap: 10px; align-items: center; position: relative; padding: 2px 4px 2px 34px; min-height: 30px;
  border-style: solid; border-color: transparent; border-width: 11px 13px; border-image: url(/assets/sprites/row-warm.png) 34 fill / 11px 13px stretch; background: none; transition: transform .08s; }
.opt .cursor { position: absolute; left: -2px; top: 50%; width: 30px; height: 30px; margin-top: -15px; opacity: 0; object-fit: contain; }
.opt:hover:not([disabled]) { border-image-source: url(/assets/sprites/row-hover-warm.png); border-image-slice: 40 fill; transform: translateX(3px); }
.opt:hover:not([disabled]) .cursor { opacity: 1; animation: nudge .5s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(4px); } }
.opt .key { flex: none; width: 26px; height: 26px; display: grid; place-items: center; font-size: 13px; color: #2b1a02; background: url(/assets/sprites/dot-gem.png) center / contain no-repeat; }
.opt[disabled] { cursor: default; }
.opt.right { border-image-source: url(/assets/sprites/row-right.png); border-image-slice: 38 fill; }
.opt.wrong { border-image-source: url(/assets/sprites/row-wrong.png); border-image-slice: 34 fill; }
.opt.dim { opacity: .5; }
.verdict { margin-top: 14px; display: flex; gap: 12px; align-items: center; border-style: solid; border-color: transparent; border-width: 11px 13px; border-image: url(/assets/sprites/row-warm.png) 34 fill / 11px 13px stretch; padding: 0 4px; }
.verdict.good { border-image-source: url(/assets/sprites/row-right.png); border-image-slice: 38 fill; }
.verdict.bad { border-image-source: url(/assets/sprites/row-wrong.png); border-image-slice: 34 fill; }
.verdict .big { font-size: 16px; }
.verdict .notes { font-size: 13px; color: var(--muted); }
.teach { margin-top: 12px; border-style: solid; border-color: transparent; border-width: 10px 12px; border-image: url(/assets/sprites/frame-input-warm.png) 34 fill / 10px 12px stretch; padding: 2px 4px; }
.teach b { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--accent); margin-bottom: 4px; }
.teach p { margin: 0 0 8px; white-space: pre-wrap; } .teach p:last-child { margin-bottom: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; padding: 1px 6px; min-height: 40px; background: none; color: #2a1a08;
  border-style: solid; border-color: transparent; border-width: 11px 13px; border-image: url(/assets/sprites/btn-steel.png) 40 46 fill / 11px 13px stretch;
  filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)); transition: transform .08s; }
.btn .ic { width: 20px; height: 20px; }
.btn:hover { transform: translateY(-1px); filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)) brightness(1.06); }
.btn:active { transform: translateY(2px); }
.btn.primary { border-image-source: url(/assets/sprites/btn-gold.png); color: #3a2402; }
.btn.primary:active { border-image-source: url(/assets/sprites/btn-gold-pressed.png); }
.btn.danger { border-image-source: url(/assets/sprites/btn-red.png); color: #fff; }
.btn.ghost { border-image-source: url(/assets/sprites/frame-chip-warm.png); border-image-slice: 32 42 fill; color: var(--muted); filter: none; }
.btn.small { min-height: 34px; font-size: 11px; }
.btn[disabled] { opacity: .5; cursor: default; transform: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 800; text-decoration: underline; text-underline-offset: 2px; }
textarea, input.field, select.field { width: 100%; color: var(--text); padding: 2px 4px; font: inherit; background: transparent;
  border-style: solid; border-color: transparent; border-width: 10px 12px; border-image: url(/assets/sprites/frame-input-warm.png) 34 fill / 10px 12px stretch; }
input.field::placeholder, textarea::placeholder, .askrow input::placeholder { color: #9c7f5c; }
textarea { min-height: 80px; resize: vertical; }
.challenge-box { margin-top: 12px; display: grid; gap: 8px; }
.note { margin-top: 12px; padding: 0 4px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start;
  border-style: solid; border-color: transparent; border-width: 10px 12px; border-image: url(/assets/sprites/row-warm.png) 34 fill / 10px 12px stretch; }
.note > img { width: 24px; height: 24px; object-fit: contain; flex: none; }
.note.won { border-image-source: url(/assets/sprites/row-right.png); border-image-slice: 38 fill; }
.note.fix, .note.wait { border-image-source: url(/assets/sprites/row-hover-warm.png); border-image-slice: 40 fill; }
.note .via { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.thread { display: grid; gap: 8px; margin-top: 12px; }
.msg { padding: 0 4px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; border-style: solid; border-color: transparent; border-width: 10px 12px; border-image: url(/assets/sprites/frame-input-warm.png) 34 fill / 10px 12px stretch; }
.msg.user { justify-self: end; max-width: 85%; border-image-source: url(/assets/sprites/row-warm.png); }
.msg .who { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--accent); margin-bottom: 3px; white-space: normal; }
.msg .who .via { font-family: ui-sans-serif, system-ui, sans-serif; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); }
.msg.system { font-size: 12.5px; color: var(--muted); text-align: center; border: 0; padding: 2px; }
.askrow { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.askrow input { flex: 1; min-width: 0; color: var(--text); font: inherit; background: transparent; padding: 2px 4px; border-style: solid; border-color: transparent; border-width: 10px 12px; border-image: url(/assets/sprites/frame-input-warm.png) 34 fill / 10px 12px stretch; }
.kbd { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.idle { text-align: center; padding: 18px 10px; }
.idle img { width: 140px; height: 128px; object-fit: contain; animation: bob 2.2s ease-in-out infinite; }
.idle h2 { margin: 8px 0 4px; font-size: 16px; }
.idle p { color: var(--muted); margin: 0 auto; max-width: 420px; font-size: 14px; }
.idle .weak { margin-top: 12px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.dots::after { content: ''; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
.pop { animation: popin .3s cubic-bezier(.2,1.4,.4,1); }
@keyframes popin { from { transform: scale(.96); opacity: .4; } to { transform: scale(1); opacity: 1; } }
.empty { color: var(--muted); font-size: 13px; }

/* ---------- quest log (collapsed by default) */
.histbox { margin-top: 16px; }
.histbox summary { list-style: none; cursor: pointer; padding: 2px 4px; display: flex; align-items: center; gap: 10px; font-size: 13px; user-select: none; }
.histbox summary::-webkit-details-marker { display: none; }
.histbox summary .chev { transition: transform .2s; width: 18px; height: 18px; }
.histbox[open] summary .chev { transform: rotate(180deg); }
.histbox summary .count { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; text-transform: none; letter-spacing: 0; font-weight: 600; }
.histbox .trail { margin-left: auto; display: flex; gap: 3px; }
.trail i { width: 9px; height: 9px; border-radius: 50%; background: rgba(128,128,128,.4); }
.trail i.r { background: var(--good); } .trail i.w { background: var(--bad); }
.hist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; max-height: 320px; overflow: auto; padding: 8px 0 0; }
.hist button { text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 4px 6px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.hist button:hover { background: rgba(128,128,128,.15); }
.hist .q { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- menu (tutor, save data, window) and modal */
.menu { position: absolute; right: 0; top: 50px; z-index: 30; width: min(400px, calc(100vw - 32px)); display: grid; gap: 10px; max-height: calc(100vh - 80px); overflow: hidden auto; padding: 4px; }
.menu .close { position: absolute; top: 0; right: 0; width: 30px; height: 30px; border: 0; padding: 0; background: url(/assets/sprites/btn-close.png) center / contain no-repeat; }
.menu h3 { margin: 0; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.menu section { display: grid; gap: 8px; padding-top: 34px; background: url(/assets/sprites/divider.png) center 4px / auto 22px no-repeat; }
.menu section:first-of-type { background: none; padding-top: 0; }
.menu p { margin: 0; font-size: 13px; color: var(--muted); }
.menu label.lbl { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
.menu .row { display: flex; gap: 6px; align-items: center; }
.menu a { color: var(--accent); font-weight: 700; }
.menu pre.slcode { margin: 0; padding: 7px 10px; font-size: 11.5px; line-height: 1.45; white-space: pre-wrap; word-break: break-all; }
.tstatus { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; padding: 0 4px; border-style: solid; border-color: transparent; border-width: 8px 10px; border-image: url(/assets/sprites/row-warm.png) 34 fill / 8px 10px stretch; color: var(--text); }
.tstatus i { width: 12px; height: 12px; border-radius: 50%; background: var(--warn); flex: none; box-shadow: 0 0 6px var(--warn); }
.tstatus.ok i { background: var(--good); box-shadow: 0 0 6px var(--good); }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
.switch input { appearance: none; -webkit-appearance: none; width: 54px; height: 28px; flex: none; margin: 0; cursor: pointer; background: url(/assets/sprites/toggle-off-warm.png) center / contain no-repeat; }
.switch input:checked { background-image: url(/assets/sprites/toggle-on.png); }
.backdrop { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(24,15,6,.62); padding: 16px; }
.modal { width: min(440px, 100%); display: grid; gap: 12px; padding: 4px; animation: popin .25s cubic-bezier(.2,1.4,.4,1); }
.modal h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.modal p { margin: 0; font-size: 14px; }

/* ---------- toasts, confetti, overlays */
.toasts { position: fixed; top: 14px; right: 14px; display: grid; gap: 8px; z-index: 80; max-width: min(360px, calc(100vw - 28px)); }

/* ---------- the app window's title bar (no OS frame): drag to move, double-click to maximize */
body.app { height: 100vh; overflow: hidden; }
body.app .scroller { position: fixed; top: 42px; left: 0; right: 0; bottom: 0; overflow: auto; } /* the scrollbar starts below the title bar */
body.app .scroller::-webkit-scrollbar { width: 12px; }
body.app .scroller::-webkit-scrollbar-track { background: #2a1d0f; border-left: 2px solid #140d05; }
body.app .scroller::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #ffe08a, #c8901c); border: 2px solid #5a3a0a; border-radius: 6px; }
body.app .scroller::-webkit-scrollbar-thumb:hover { background: linear-gradient(90deg, #fff0b0, #e0a52c); }
body.app .toasts { top: 54px; }
body.app .levelbar { top: 56px; }
.titlebar { position: fixed; top: 0; left: 0; right: 0; height: 42px; z-index: 95; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px;
  -webkit-app-region: drag; user-select: none; color: #fff;
  background: linear-gradient(180deg, #b8874f 0%, #8f6131 45%, #6a4420 100%);
  border-bottom: 3px solid #f1dcb0; box-shadow: 0 2px 0 #140d05, inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 #c8901c, 0 6px 10px rgba(0,0,0,.45); }
.titlebar::before, .titlebar::after { content: ''; position: absolute; bottom: -3px; width: 26px; height: 26px; background: url(/assets/sprites/corner.png) center / contain no-repeat; pointer-events: none; }
.titlebar::before { left: 0; transform: scaleY(-1); } .titlebar::after { right: 0; transform: scale(-1, -1); }
.tb-crest { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
.tb-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tb-title small { font-size: 11px; color: #f6e7c8; text-transform: none; letter-spacing: 0; font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; text-shadow: none; }
.tb-count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; margin-left: 8px; border-radius: 10px; font-size: 11px; color: #3a2402;
  background: linear-gradient(180deg, #ffe08a, #e0a52c); border: 2px solid #5a3a0a; text-shadow: none; vertical-align: 1px; }
.tb-space { flex: 1; }
.tb-btn { -webkit-app-region: no-drag; position: relative; width: 32px; height: 32px; border: 0; padding: 0; background: none; display: grid; place-items: center;
  filter: drop-shadow(0 2px 1px rgba(0,0,0,.55)); transition: transform .08s, filter .12s; }
.tb-btn:hover { transform: scale(1.14); filter: drop-shadow(0 0 7px rgba(255,222,120,.85)) drop-shadow(0 2px 1px rgba(0,0,0,.55)); }
.tb-btn:active { transform: scale(.9); }
.tb-btn img { width: 100%; height: 100%; object-fit: contain; }
.tb-btn .sym { position: absolute; inset: 0; pointer-events: none; }
.tb-min .sym::after { content: ''; position: absolute; left: 9px; right: 9px; top: 50%; height: 4px; margin-top: 0; background: #fff; border-radius: 2px; box-shadow: 0 0 0 1.5px #6a3200; }
.tb-max .gem { filter: hue-rotate(80deg) saturate(1.25) brightness(.95); } /* the gold gem, turned green */
.tb-max .sym::after { content: ''; position: absolute; inset: 9px; border: 3px solid #fff; border-radius: 3px; box-shadow: 0 0 0 1.5px #0d4a16, inset 0 0 0 1.5px #0d4a16; }
.tb-max.restore .sym::after { inset: 12px 8px 8px 12px; }
.tb-max.restore .sym::before { content: ''; position: absolute; inset: 7px 11px 13px 7px; border: 3px solid #fff; border-bottom: 0; border-right: 0; border-radius: 3px 0 0 0; box-shadow: -1.5px -1.5px 0 #0d4a16; }
.tb-close { width: 34px; height: 34px; margin-left: 2px; }
.toast { font-size: 14px; display: flex; gap: 10px; align-items: center; animation: popin .25s cubic-bezier(.2,1.4,.4,1); }
.toast img { width: 26px; height: 26px; object-fit: contain; }
canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 65; }
.welcome { padding: 22px; text-align: center; }
.welcome img { width: 160px; height: 140px; object-fit: contain; }

.overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(24,15,6,.8); cursor: pointer; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; } }
.overlay .card2 { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 0 16px; }
.overlay .banner { font-size: 16px; color: #fff; padding: 0 6px; min-width: 240px; border-style: solid; border-color: transparent; border-width: 12px 40px 20px; border-image: url(/assets/sprites/ribbon-warm.png) 40 96 58 96 fill / 12px 40px 20px stretch; animation: banner .55s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes banner { from { transform: scale(.3) rotate(-6deg); opacity: 0; } }
.overlay .mstage { position: relative; width: 260px; height: 230px; display: grid; place-items: center; }
.overlay .medal { width: 170px; height: 170px; object-fit: contain; position: relative; z-index: 2; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
.overlay .bname { font-size: 20px; color: #fff; }
.overlay .bdesc { color: #f0e1c6; font-size: 14px; max-width: 320px; }
.overlay .hint { color: #c4a987; font-size: 12px; margin-top: 4px; }
.bfx { position: absolute; inset: 0; pointer-events: none; }
.ray { position: absolute; left: 50%; top: 50%; width: 340px; height: 340px; margin: -170px 0 0 -170px; z-index: 1; opacity: .7;
  background: repeating-conic-gradient(from 0deg, rgba(255,210,74,.5) 0 9deg, transparent 9deg 24deg); animation: spin 7s linear infinite; border-radius: 50%;
  -webkit-mask: radial-gradient(circle, #000 18%, transparent 68%); mask: radial-gradient(circle, #000 18%, transparent 68%); }
@keyframes spin { to { transform: rotate(360deg); } }
/* one entrance per badge */
.b-first_blood .medal { animation: dropin .9s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes dropin { 0% { transform: translateY(-300px); } 55% { transform: translateY(0) scale(1.18, .78); } 72% { transform: translateY(-26px) scale(.95, 1.05); } 100% { transform: none; } }
.b-on_fire .medal { animation: rise2 .7s ease-out both, burn .16s steps(2) .7s 10; }
@keyframes rise2 { from { transform: translateY(80px) scale(.4); opacity: 0; } }
@keyframes burn { 50% { transform: translateY(-3px) scale(1.04); filter: drop-shadow(0 0 18px #ff8a2a) brightness(1.15); } }
.b-unstoppable .medal { animation: jolt .5s steps(4) .25s both; }
.b-unstoppable.overlay::before { content: ''; position: fixed; inset: 0; background: #fff; animation: flash .45s steps(2) 2; pointer-events: none; opacity: 0; }
@keyframes flash { 0%, 49% { opacity: .9; } 50%, 100% { opacity: 0; } }
@keyframes jolt { 0% { transform: scale(0); } 25% { transform: scale(1.3) translate(-6px, 4px); } 50% { transform: scale(.9) translate(6px, -4px); } 75% { transform: scale(1.1) translate(-3px, 2px); } 100% { transform: scale(1); } }
.b-gotcha .medal { animation: zoomin .8s cubic-bezier(.2,1.4,.4,1) .55s both; }
@keyframes zoomin { from { transform: scale(.1) rotate(-200deg); opacity: 0; } }
.reticle { position: absolute; width: 30px; height: 30px; border: 5px solid #ff6262; z-index: 3; animation: converge .6s ease-out both; }
.reticle.tl { border-right: 0; border-bottom: 0; --sx: -90px; --sy: -80px; left: calc(50% - 92px); top: calc(50% - 92px); }
.reticle.tr { border-left: 0; border-bottom: 0; --sx: 90px; --sy: -80px; left: calc(50% + 62px); top: calc(50% - 92px); }
.reticle.bl { border-right: 0; border-top: 0; --sx: -90px; --sy: 80px; left: calc(50% - 92px); top: calc(50% + 62px); }
.reticle.br { border-left: 0; border-top: 0; --sx: 90px; --sy: 80px; left: calc(50% + 62px); top: calc(50% + 62px); }
@keyframes converge { from { transform: translate(var(--sx), var(--sy)); opacity: 0; } }
.b-bug_hunter .medal { animation: popin2 .5s cubic-bezier(.2,1.6,.4,1) 1.35s both; }
@keyframes popin2 { from { transform: scale(0); } }
.crawler { position: absolute; width: 70px; height: 70px; object-fit: contain; z-index: 3; left: 50%; top: 50%; margin: -35px 0 0 -35px; animation: crawl 1.05s steps(10) both, squash .3s steps(2) 1.05s forwards; }
@keyframes crawl { from { transform: translateX(-200px); } to { transform: translateX(0); } }
@keyframes squash { to { transform: scale(1.5, .15); opacity: 0; } }
.b-overtake .medal { animation: race .8s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes race { 0% { transform: translateX(-420px) skewX(-20deg); } 70% { transform: translateX(24px) skewX(10deg); } 100% { transform: none; } }
.speedlines { position: absolute; inset: 50px -40px; z-index: 1; background: repeating-linear-gradient(180deg, transparent 0 14px, rgba(255,255,255,.55) 14px 17px); animation: lines .8s ease-out forwards; }
@keyframes lines { from { transform: translateX(-300px); opacity: 1; } to { transform: translateX(200px); opacity: 0; } }
.b-scholar .medal { animation: pageflip 1.1s ease-out both; }
@keyframes pageflip { 0% { transform: perspective(400px) rotateY(-180deg) scale(.6); opacity: 0; } 60% { transform: perspective(400px) rotateY(20deg) scale(1.05); opacity: 1; } 100% { transform: perspective(400px) rotateY(0); } }
.b-speedster .medal { animation: zip .6s cubic-bezier(.2,1.2,.4,1) both, skid .35s steps(3) .6s; }
@keyframes zip { from { transform: translate(-320px, 220px) rotate(-30deg) scale(.5); } }
@keyframes skid { 33% { transform: rotate(8deg); } 66% { transform: rotate(-5deg); } }
.b-polymath .medal { animation: popin2 .45s cubic-bezier(.2,1.6,.4,1) .85s both; }
.shape { position: absolute; width: 56px; height: 56px; object-fit: contain; left: 50%; top: 50%; margin: -28px 0 0 -28px; z-index: 3; animation: merge .85s ease-in both; }
@keyframes merge { from { transform: translate(var(--sx), var(--sy)) rotate(180deg); } to { transform: translate(0, 0) scale(.3); opacity: 0; } }
.b-diamond .medal { animation: gemspin 1.4s ease-out both, shimmer 1.2s ease-in-out 1.4s infinite; }
@keyframes gemspin { 0% { transform: perspective(400px) rotateY(0) scale(.2); opacity: 0; } 30% { opacity: 1; } 100% { transform: perspective(400px) rotateY(720deg) scale(1); } }
@keyframes shimmer { 50% { filter: hue-rotate(50deg) brightness(1.2) drop-shadow(0 0 12px #9fd4ff); } }
.overlay.result { cursor: default; }
.overlay.result .medal { animation: popin2 .6s cubic-bezier(.2,1.6,.4,1) both; }
.overlay.result.lost .medal { animation: sink .9s ease-out both; }
.overlay.result.lost .banner { filter: grayscale(.7) brightness(.85); }
@keyframes sink { from { transform: translateY(-70px) rotate(-12deg); opacity: 0; } }
.overlay.result .actions .btn { min-width: 150px; justify-content: center; }
.levelbar { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 75; display: flex; align-items: center; gap: 10px; color: var(--gold); font-size: 15px; animation: drop .5s cubic-bezier(.2,1.5,.4,1) both; }
.levelbar img { width: 40px; height: 40px; object-fit: contain; }
@keyframes drop { from { transform: translate(-50%, -90px); } }

/* =======================================================================
   Compact layout: one header row, a shorter stage, a tighter quiz box. On screens tall enough, the page
   fits the window exactly: the stage keeps its height and only the quiz box scrolls if a quiz is long.
   ======================================================================= */
header.top { margin: 0 0 6px; gap: 6px 12px; }
.wrap { padding: 4px 14px 6px; }
.crest { font-size: 16px; } .crest img { width: 32px; height: 32px; }
body.app .crest { display: none; } /* the title bar already shows it */
.strip { order: 0; flex-basis: auto; gap: 10px; }
.strip .item { font-size: 12px; gap: 4px; }
.strip .item img { width: 20px; height: 20px; }
.lvl img { width: 26px !important; height: 26px !important; }
.lvl .xp { width: 50px; height: 10px; }
.badges img { width: 22px; height: 22px; }
.tbtn { width: 34px; height: 34px; } .tbtn img, .tbtn svg.look-ic { width: 19px; height: 19px; }
.tbtn .dot { width: 13px; height: 13px; top: -4px; right: -4px; }

.stage { margin-bottom: 6px; border-width: 10px; border-image-width: 10px; }
.arena { min-height: 0; padding: 4px 12px 5px; gap: 6px; }
.fighter { gap: 2px; }
.sprite-wrap { height: 126px; }
.hero-sprite { width: 132px; height: 126px; }
.boss-sprite { width: 132px; height: 120px; }
.fighter .plate { max-width: 240px; border-width: 6px 13px; border-image-width: 6px 13px; }
.plate .name { font-size: 11px; }
.plate .hp { font-size: 17px; }
.bar { height: 16px; margin-top: 2px; border-width: 5px 7px; border-image-width: 5px 7px; }
.vsbox { margin-bottom: 50px; } .vs { width: 46px; height: 48px; }
.ftext.dmg { font-size: 28px; }

.dialog { border-width: 14px; border-image-width: 14px; }
.card { padding: 0 4px; display: flex; flex-direction: column; }
.card::before, .card::after { width: 36px; height: 36px; top: -20px; }
.card::before { left: -20px; } .card::after { right: -20px; }
.qhead { margin-bottom: 6px; gap: 5px; }
.chip { border-width: 5px 8px; border-image-width: 5px 8px; font-size: 10.5px; }
.context { border-width: 6px 10px; border-image-width: 6px 10px; margin-bottom: 6px; font-size: 13px; line-height: 1.4; }
.context b { display: inline-flex; margin: 0 6px 0 0; vertical-align: -1px; } /* label inline with the text */
.question { font-size: 16px; margin: 0 2px 8px; line-height: 1.35; }
pre.code { font-size: 12px; line-height: 1.35; padding: 6px 12px; margin-bottom: 6px; }
.opts { gap: 4px; }
.opt { min-height: 20px; border-width: 7px 11px; border-image-width: 7px 11px; padding: 0 4px 0 32px; font-size: 14px; line-height: 1.35; }
.opt .key { width: 20px; height: 20px; font-size: 11px; }
.opt .cursor { width: 26px; height: 26px; margin-top: -13px; }
.verdict, .note { margin-top: 8px; border-width: 8px 11px; border-image-width: 8px 11px; }
.verdict .ic.l { width: 24px; height: 24px; }
.verdict .big { font-size: 14px; }
.teach { margin-top: 8px; border-width: 7px 10px; border-image-width: 7px 10px; font-size: 14px; line-height: 1.45; }
.teach p { margin-bottom: 6px; }
.thread { margin-top: 8px; gap: 6px; }
.msg { border-width: 7px 10px; border-image-width: 7px 10px; font-size: 13.5px; }
.askrow { margin-top: 8px; }
.askrow input, textarea, input.field, select.field { border-width: 7px 10px; border-image-width: 7px 10px; }
.actions { margin-top: 8px; gap: 6px; }
.btn { min-height: 32px; border-width: 8px 11px; border-image-width: 8px 11px; font-size: 11.5px; }
.btn .ic { width: 18px; height: 18px; }
.kbd { margin: 0 0 0 auto; }
.idle { padding: 6px 10px; } .idle img { width: 110px; height: 100px; } .idle h2 { margin: 4px 0 2px; }
.histbox { margin-top: 6px; border-width: 9px; border-image-width: 9px; }
.histbox summary { padding: 0 4px; font-size: 12px; }

.titlebar { height: 34px; padding: 0 6px 0 8px; }
body.app .scroller { top: 34px; } body.app .toasts { top: 46px; } body.app .levelbar { top: 46px; }
.titlebar::before, .titlebar::after { width: 20px; height: 20px; }
.tb-crest { width: 26px; height: 26px; } .tb-title { font-size: 13px; }
.tb-btn { width: 26px; height: 26px; } .tb-close { width: 28px; height: 28px; }
.tb-min .sym::after { left: 7px; right: 7px; height: 3px; margin-top: -1px; }
.tb-max .sym::after { inset: 7px; border-width: 2.5px; }
.tb-max.restore .sym::after { inset: 9px 6px 6px 9px; }
.tb-max.restore .sym::before { inset: 5px 9px 10px 5px; border-width: 2.5px; }

@media (min-width: 561px) and (min-height: 520px) {
  .wrap { height: 100vh; display: flex; flex-direction: column; }
  body.app .wrap { height: calc(100vh - 34px); }
  #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #app > .stage, #app > .histbox { flex: none; }
  #app > .card { flex: 0 1 auto; min-height: 150px; }
  .card-body { flex: 1; min-height: 0; overflow: auto; padding-right: 4px; }
  .card-body::-webkit-scrollbar { width: 10px; }
  .card-body::-webkit-scrollbar-track { background: rgba(110,72,32,.25); border-radius: 5px; }
  .card-body::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #ffe08a, #c8901c); border: 2px solid #5a3a0a; border-radius: 5px; }
  .histbox .hist { max-height: 22vh; }
}

@media (max-width: 560px) {

  .sprite-wrap { height: 140px; }
  .hero-sprite { width: 146px; height: 140px; } .boss-sprite { width: 140px; height: 128px; }
  .tbtn { width: 38px; height: 38px; } .badges img { width: 26px; height: 26px; }

let audio;
const TUNES = {
  new: [[660, .07], [880, .1]], right: [[523, .07], [659, .07], [784, .07], [1047, .14]], wrong: [[392, .12], [330, .12], [262, .2]],
  dance: [[523, .1], [659, .1], [523, .1], [784, .1], [659, .16]], badge: [[523, .09], [659, .09], [784, .09], [1047, .09], [784, .09], [1047, .24]],

function beep(kind) {
  if (!sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    let t = audio.currentTime;
    for (const [f, d] of TUNES[kind] || TUNES.new) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = kind === 'wrong' || kind === 'mad' ? 'sawtooth' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.06, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + d + .02); t += d * .92;
    }
  } catch {}
}

function confetti(n = 120) {
  if (reduceMotion() || plainLook) return;
  const c = $('#confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#6cc8ff', '#ffa05c', '#b48cff', '#6fe36f', '#ffd24a', '#ff6a6a'];
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 220, y: innerHeight / 3, vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4, r: Math.random() * 5 + 3, a: Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)] }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of ps) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); }
    if (++f < 110) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
  })();
  setTimeout(() => ctx.clearRect(0, 0, c.width, c.height), 3000); // frames pause while the window is hidden: never leave confetti frozen
}

const KW = 'const|let|var|function|return|if|else|elif|for|while|do|class|def|import|from|export|default|async|await|new|try|catch|except|finally|throw|raise|public|private|protected|static|void|int|float|string|bool|boolean|true|false|null|nil|None|True|False|undefined|this|self|fn|pub|struct|impl|interface|type|extends|implements|yield|lambda|with|as|in|of|is|not|and|or|switch|case|break|continue|match|enum|package|func|go|defer|select|where|readonly|foreach|using|namespace|SELECT|FROM|WHERE|JOIN|ON|GROUP|BY|ORDER|INSERT|UPDATE|DELETE|INTO|VALUES|AND|OR|NOT|NULL';
function highlight(code, lang) {
  const hash = /^(py|python|rb|ruby|sh|bash|zsh|yaml|yml|toml|r|ps1|powershell|perl|ex|exs)$/i.test(lang || '');
  const re = new RegExp(`(${hash ? '#[^\\n]*|' : ''}\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/|--[^\\n]*)|("(?:\\\\.|[^"\\\\\\n])*"|'(?:\\\\.|[^'\\\\\\n])*'|\`(?:\\\\.|[^\`\\\\])*\`)|\\b(${KW})\\b|\\b(\\d+(?:\\.\\d+)?f?)\\b`, 'g');
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : 'n';
    out += `<span class="tk-${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

// ---------------------------------------------------------------- network
async function api(pathname, body) {
  const res = await fetch(pathname, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p: slug, ...body }) } : {});
  return res.json();
}

async function poll() {
  try {
    const data = await api('/api/state' + (slug ? `?p=${encodeURIComponent(slug)}` : ''));
    if (data.empty) { renderWelcome(); return; }
    if (!slug || slug !== data.project.slug) { slug = data.project.slug; store.set('project', slug); }
    onState(data);
  } catch (e) {
    $('#app').innerHTML = `<div class="win welcome">${px('icon-alert', 'xl')}<p>Lost connection to the SkillMe server. It runs inside your AI's MCP server or the SkillMe window: is one of them still open?</p><span class="empty">Retrying<span class="dots"></span></span></div>`;
    mainKey = stripKey = '';
    layoutKey = 'offline';
  }
}

async function loadProjects() {
  try {
    const { projects } = await api('/api/projects');
    const sel = $('#project');
    sel.hidden = projects.length < 2;
    sel.innerHTML = projects.map((p) => `<option value="${esc(p.slug)}"${p.slug === slug ? ' selected' : ''}>${esc(p.name)}${p.pending ? ` (${p.pending})` : ''}</option>`).join('');
  } catch {}
}
$('#project').onchange = (e) => { slug = e.target.value; store.set('project', slug); view = { quizId: null, result: null }; mainKey = ''; layoutKey = ''; S = null; poll(); };

// ---------------------------------------------------------------- state handling
function onState(data) {
  const prev = S && S.project.slug === data.project.slug ? S : null;
  const wasInstalling = !!(S && S.app && S.app.installing);
  S = data;
  if (wasInstalling && data.app && !data.app.installing) toast(data.app.installed ? 'icon-chest' : 'icon-alert', data.app.installed ? 'The window app is installed: open it from the menu, or wait for the next quiz.' : esc(data.app.error || 'The window app did not install.'));
  for (const q of data.pending) {
    if (!seenPending.has(q.id)) {
      seenPending.add(q.id);
      if (!firstLoad) {
        beep('new');
        if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
          try { const n = new Notification(`SkillMe quiz #${q.n}: ${q.concept}`, { body: q.question, tag: q.id, icon: SPR('icon-player') }); n.onclick = () => { focus(); n.close(); }; } catch {}
        }
      }
    }
  }
  store.set('seen', [...seenPending].slice(-300));
  if (prev) {
    for (const q of data.history) {
      const old = prev.history.find((h) => h.id === q.id);
      if (old && old.challenge && old.challenge.status === 'open' && q.challenge && q.challenge.status !== 'open') {
        if (q.challenge.status === 'human_right') {
          toast('icon-crown', `<b>Challenge won on #${q.n}!</b> +30 XP${q.challenge.fix ? '<br>It exposed a real bug, so a fix was sent to the coding AI.' : ''}`);
        } else toast('icon-shield', `The answer key for #${q.n} stands. Open it in the quest log for the reasoning.`);
      }
      const tutorMsgs = (x) => (x && x.thread ? x.thread.filter((m) => m.role === 'tutor').length : 0);
      if (old && tutorMsgs(q) > tutorMsgs(old)) { toast('icon-hat', `The tutor answered your question on #${q.n}.`); beep('new'); }
    }
    for (const b of data.scores.badges) if (!prev.scores.badges.find((x) => x.id === b.id)) queueBadge(b);
  }
  // Every blow (answers, skips, expired quizzes, challenges, mistakes you caught in chat) comes from the
  // server's battle state, so the stage animates hits even when they happened elsewhere.
  const last = data.battle && data.battle.last;
  if (last && last.id !== lastHitId) {
    if (prev && !firstLoad) setTimeout(() => animateHit(last), 0); // after this render
    lastHitId = last.id;
  }
  firstLoad = false;
  document.title = (data.pending.length ? `(${data.pending.length}) ` : '') + 'SkillMe Arena';
  if ($('#tbTitle')) $('#tbTitle').innerHTML = `SkillMe Arena <small>· ${esc(data.project.name)}</small>${data.pending.length ? `<span class="tb-count">${data.pending.length}</span>` : ''}`;
  renderMenuDot();
  if (!$('#menu').hidden) renderMenuState();
  if (!view.busy) render();
}

function currentQuiz() {
  if (view.result) {
    const fresh = S.history.find((h) => h.id === view.result.quiz.id);
    if (fresh) view.result.quiz = { ...view.result.quiz, ...fresh };
    return view.result.quiz;
  }
  if (!S.pending.length) { view.quizId = null; return null; }
  if (!view.quizId || !S.pending.find((q) => q.id === view.quizId)) view.quizId = S.pending[0].id;
  return S.pending.find((q) => q.id === view.quizId);
}

}
function renderStrip() {

// ---------------------------------------------------------------- HP bars
// Green above half, gold to a quarter, red below. A white trail shows the damage for a moment.
const FILL = { high: 'bar-green-fill', mid: 'bar-gold-fill', low: 'bar-red-fill' };
const FILL_FALLBACK = { high: 'hue-rotate(75deg) saturate(1.1)', low: 'hue-rotate(-28deg) saturate(1.5)' }; // until sheet 9 adds real green/red fills
const FILL_SLICE = { 'bar-green-fill': '34 36 fill', 'bar-red-fill': '34 36 fill', 'bar-gold-fill': '38 40 fill' };
function paintBar(who, v, max) {
  const pct = Math.max(0, Math.min(100, (v / max) * 100));
  const lvl = pct > 50 ? 'high' : pct > 25 ? 'mid' : 'low';
  const fill = $(`#${who}Fill`), lag = $(`#${who}Lag`), width = pct > 0 ? (plainLook ? `${pct}%` : `calc(${pct}% + 8px)`) : '0px';
  fill.dataset.level = lvl;
  fill.style.width = width; lag.style.width = width;
  fill.style.borderImageSource = `url(${SPR(FILL[lvl])})`;
  fill.style.borderImageSlice = has(FILL[lvl]) ? FILL_SLICE[FILL[lvl]] : ''; // keep each fill's rounded ends round
  fill.style.filter = has(FILL[lvl]) ? '' : (FILL_FALLBACK[lvl] || '');
  fill.style.visibility = pct > 0 ? '' : 'hidden';
  $(`#${who}Hp`).textContent = v;
  $(`#${who}Plate`).classList.toggle('low', lvl === 'low' && v > 0);
}

function renderStage() {
  const b = S.battle;
  paintBar('hero', b.hp.human, b.max);
  paintBar('boss', b.hp.ai, b.max);
  $('#hero').title = `You: ${b.hp.human}/${b.max} HP · you understand ${S.scores.human}% of the code`;
  $('#boss').title = `Claude: ${b.hp.ai}/${b.max} HP · it knows ${S.scores.ai}% of the codebase`;
  const vs = $('#vsBox'), mode = b.over ? 'again' : 'vs';
  if (vs.dataset.mode !== mode) {
    vs.dataset.mode = mode;
    vs.innerHTML = b.over ? `<button class="btn primary ui" id="againBtn" title="Both back to ${b.max} HP">${px('icon-swords')}Fight again</button>` : (plainLook ? '<span class="vs-text">vs</span>' : `<img class="vs" src="${SPR('vs-emblem')}" alt="versus">`);
    if (b.over) $('#againBtn').onclick = fightAgain;
  }
  if (!reacting) restPoses();
}

// ---------------------------------------------------------------- the fighters
const poses = { hero: 'idle', boss: 'idle' };
function setPose(who, pose) {
  poses[who] = pose;
  const img = $(who === 'hero' ? '#heroImg' : '#bossImg');
  if (img) img.src = SPR(POSES[who][pose] || POSES[who].idle);
}
/** The pose a fighter holds between reactions: knocked out, celebrating, worn out (low HP) or ready. */
function restPose(who) {
  const b = S && S.battle;
  if (!b) return 'idle';
  const mine = who === 'hero' ? 'human' : 'ai';
  if (b.over) return b.over === mine ? (who === 'hero' ? 'victory' : 'win') : 'ko';
  return b.hp[mine] <= 25 && has(POSES[who].low) ? 'low' : 'idle';
}
function restPoses() {
  for (const who of ['hero', 'boss']) {
    const p = restPose(who), el = $('#' + who);
    if (!el) continue;
    if (poses[who] !== p && !(poses[who] === 'blink' && p === 'idle')) setPose(who, p);
    el.classList.toggle('down', p === 'ko');
    el.classList.toggle('fallen', p === 'ko' && !has(POSES[who].ko)); // no KO art yet: tip the hurt pose over
  }
}
// blinking now and then
setInterval(() => {
  if (layoutKey !== 'main' || reacting) return;
  for (const who of ['hero', 'boss']) {
    if (poses[who] !== 'idle') continue;
    setPose(who, 'blink');
    setTimeout(() => { if (poses[who] === 'blink') setPose(who, 'idle'); }, 180);
  }
}, 3800);

let reactTimer = null, danceTimer = null, reacting = false;
function resetStage() {
  clearInterval(danceTimer);
  for (const id of ['hero', 'boss']) { const el = $('#' + id); if (el) el.className = `fighter ${id}`; }
  restPoses();
}
function dance(ms) {
  let b = false;
  setPose('boss', 'danceA');
  clearInterval(danceTimer);
  danceTimer = setInterval(() => { b = !b; setPose('boss', b ? 'danceB' : 'danceA'); }, 275);
  setTimeout(() => clearInterval(danceTimer), ms);
}
function anchor(who, fy = 0.4) {
  const st = $('#stage'), el = $(who === 'hero' ? '#heroImg' : '#bossImg');
  if (!st || !el) return { x: 0, y: 0 };
  const a = st.getBoundingClientRect(), b = el.getBoundingClientRect();
  return { x: b.left - a.left + b.width / 2, y: b.top - a.top + b.height * fy };
}
function particle(sprite, x, y, cls = '', vars = {}) {
  const fx = $('#fx');
  if (!fx || reduceMotion() || plainLook) return;
  const el = document.createElement('img');
  el.className = `pt ${cls}`;
  el.src = SPR(sprite);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  for (const [k, v] of Object.entries(vars)) el.style.setProperty(k, v);
  el.addEventListener('animationend', () => el.remove());
  fx.appendChild(el);
}
function floatText(text, who, cls) {
  const fx = $('#fx');
  if (!fx) return;
  const p = anchor(who, 0.05);
  const el = document.createElement('div');
  el.className = `ftext ui outline ${cls}`;
  el.textContent = text;
  el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
  el.addEventListener('animationend', () => el.remove());
  fx.appendChild(el);
}
function burst(sprite, who, count, spread, cls = '') {
  const p = anchor(who, 0.3);
  for (let i = 0; i < count; i++) {
    setTimeout(() => particle(sprite, p.x + (Math.random() - .5) * spread, p.y + (Math.random() - .5) * 30, cls,
      { '--dx': `${(Math.random() - .5) * 100}px`, '--dy': `${-60 - Math.random() * 60}px`, '--r': `${(Math.random() - .5) * 60}deg` }), i * 150);
  }
}

/**
 * kind: youHit (you hit Claude) | claudeHit (Claude hit you) | badge | level.
 * info.hit is the blow from the server: { damage, crit, cause, ko }.
 */
function stageReact(kind, info = {}) {
  const hero = $('#hero'), boss = $('#boss');
  if (!hero || !boss) return;
  if (plainLook) return plainReact(kind, info);
  clearTimeout(reactTimer);
  reacting = true;
  resetStage();
  hero.classList.remove('down', 'fallen'); boss.classList.remove('down', 'fallen');
  void hero.offsetWidth; // restart CSS animations
  const h = info.hit || {};
  const big = h.crit || h.cause === 'challenge' || h.cause === 'correction';
  let ms = 2200;
  if (kind === 'youHit') {
    hero.classList.add('attack'); setPose('hero', big ? 'crit' : 'attack');
    setTimeout(() => {
      boss.classList.add('hurt'); setPose('boss', 'hit');
      const c = anchor('boss', 0.45);
      particle(big ? 'fx-crit' : 'fx-impact', c.x - 30, c.y, 'pop big');
      if (h.damage) floatText(`-${h.damage}`, 'boss', 'dmg');
      if (big) setTimeout(() => floatText(h.crit ? 'Critical!' : h.cause === 'challenge' ? 'Challenge won!' : 'Gotcha!', 'boss', 'crit'), 160);
      beep('mad');
      if (h.ko) return;
      setTimeout(() => { boss.classList.remove('hurt'); boss.classList.add('mad'); setPose('boss', 'angry'); }, 560);
      const top = anchor('boss', 0.05);
      setTimeout(() => particle('fx-anger', top.x + 50, top.y + 14, 'pop'), 600);
      for (let i = 0; i < 5; i++) setTimeout(() => particle('fx-steam', top.x + (i % 2 ? 34 : -34), top.y + 6, '', { '--dx': `${(i % 2 ? 1 : -1) * 28}px`, '--dy': '-50px' }), 650 + i * 260);
    }, 240);
    if (info.xp) setTimeout(() => floatText(`+${info.xp} XP`, 'hero', 'gold'), 500);
    if (!h.ko) setTimeout(() => setPose('hero', 'cheer'), 700);
    ms = 2500;
  } else if (kind === 'claudeHit') {
    boss.classList.add('charge'); setPose('boss', 'attack');
    setTimeout(() => {
      hero.classList.add('flinch'); setPose('hero', 'hurt');
      const c = anchor('hero', 0.45);
      particle('fx-claude-hit', c.x + 20, c.y, 'pop big');
      if (h.damage) floatText(`-${h.damage}`, 'hero', 'dmg');
      beep('wrong');
      if (h.ko) return;
      // ...then Claude gloats: the dance
      setTimeout(() => {
        boss.classList.remove('charge'); boss.classList.add('dance'); dance(1700);
        beep('dance');
        burst('fx-note', 'boss', 3, 120, 'tune');
        burst('fx-notes', 'boss', 3, 120, 'tune');
      }, 420);
      setTimeout(() => setPose('hero', restPose('hero') === 'low' ? 'low' : 'idle'), 1100);
    }, 300);
    ms = 2500;
  } else if (kind === 'badge') {
    boss.classList.add('shock'); setPose('boss', 'shocked');
    hero.classList.add('victory'); setPose('hero', 'victory');
    const top = anchor('boss', 0.02);
    particle('fx-bang', top.x + 56, top.y, 'pop big');
    setTimeout(() => { boss.classList.remove('shock'); boss.classList.add('sulk'); setPose('boss', 'sad'); setPose('hero', 'cheer'); }, 850);
    ms = 2700;
  } else if (kind === 'level') {
    hero.classList.add('levelup', 'victory'); setPose('hero', 'levelup');
    burst('fx-spark', 'hero', 8, 80);
    ms = 2300;
  }
  reactTimer = setTimeout(() => { reacting = false; resetStage(); }, ms);
}

/** Classic look: the plate that lost HP flashes and shows the damage for a moment; nothing moves. */
function plainReact(kind, info) {
  const h = info.hit || {};
  if (kind === 'youHit') beep('mad'); else if (kind === 'claudeHit') beep('wrong');
  if (!h.damage || (kind !== 'youHit' && kind !== 'claudeHit')) return;
  const plate = $(kind === 'youHit' ? '#bossPlate' : '#heroPlate');
  if (!plate) return;
  plate.classList.remove('flash'); void plate.offsetWidth; plate.classList.add('flash');
  const d = document.createElement('span');
  d.className = 'delta';
  d.textContent = `-${h.damage}${h.crit ? ' critical' : ''}`;
  d.addEventListener('animationend', () => d.remove());
  $('.row', plate).appendChild(d);
}

// ---------------------------------------------------------------- blows and knockouts (from the server's battle state)
let lastHitId = null, pendingInfo = null, koPending = false;
function animateHit(h) {
  const info = h.cause === 'answer' ? pendingInfo || {} : {};
  pendingInfo = null;
  stageReact(h.target === 'ai' ? 'youHit' : 'claudeHit', { ...info, hit: h });
  if (h.ko) { koPending = true; setTimeout(() => knockout(h), 900); }
}

function knockout(h) {
  const youWon = h.ko === 'human';
  const winner = youWon ? 'hero' : 'boss', loser = youWon ? 'boss' : 'hero';
  if (plainLook) { beep(youWon ? 'badge' : 'wrong'); return showResult(h, youWon); }
  clearTimeout(reactTimer);
  reacting = true;
  resetStage();
  const L = $('#' + loser), W = $('#' + winner);
  if (!L || !W) return;
  L.classList.add('down'); setPose(loser, 'ko');
  if (!has(POSES[loser].ko)) L.classList.add('fallen');
  if (youWon) { W.classList.add('victory'); setPose('hero', 'victory'); } else { W.classList.add('dance'); dance(1600); }
  const top = anchor(loser, 0.35);
  for (let i = 0; i < 3; i++) setTimeout(() => particle('fx-dizzy', top.x + (i - 1) * 30, top.y, 'pop'), i * 220);
  beep(youWon ? 'badge' : 'wrong');
  setTimeout(() => {
    reacting = false; resetStage();
    if (youWon) confetti(160);
    showResult(h, youWon);
  }, 1300);
}

/** The battle result screen (both looks). */
function showResult(h, youWon) {
  const b = S.battle;
  const ov = document.createElement('div');
  ov.className = `overlay result ${youWon ? 'won' : 'lost'}`;
  ov.innerHTML = `<div class="card2">
    <div class="banner ui outline">${youWon ? 'Victory!' : 'Defeat'}</div>
    <div class="mstage">${plainLook ? px(youWon ? 'emblem-victory' : 'emblem-defeat') : `${youWon ? '<div class="ray"></div>' : ''}<img class="medal" src="${SPR(youWon ? 'emblem-victory' : 'emblem-defeat')}" alt="">`}</div>
    <div class="bname ui outline">${youWon ? 'You knocked Claude out!' : 'Claude knocked you out'}</div>
    <div class="bdesc">${youWon ? `Battle ${h.battle} is yours: +${h.xp || 50} XP.` : `Battle ${h.battle} goes to Claude. Get the next quizzes right to win the rematch.`}</div>
    <div class="bdesc">Record: ${b.wins} win${b.wins === 1 ? '' : 's'} · ${b.losses} loss${b.losses === 1 ? '' : 'es'}</div>
    <div class="actions" style="justify-content:center"><button class="btn primary ui" data-again>${px('icon-swords')}Fight again</button><button class="btn ghost ui" data-close>Later</button></div></div>`;
  document.body.appendChild(ov);
  koPending = false; // badges wait while this screen is open (nextBadge checks for it)
  ov.onclick = (e) => {

function fxImg(parent, sprite, cls, style = {}) {
  const el = document.createElement('img');

}
function fxParticle(parent, sprite, x, y, vars, delay = 0, cls = '') {
  setTimeout(() => {
    const el = fxImg(parent, sprite, `pt ${cls}`, { left: x + 'px', top: y + 'px' });
    for (const [k, v] of Object.entries(vars)) el.style.setProperty(k, v);
    el.addEventListener('animationend', () => el.remove());
  }, delay);
}

}

async function answer(q, i) {
  if (view.busy) return;
  view.busy = true; // freezes re-rendering so a background poll can't jump to the next quiz mid-answer
  let res;
  try { res = await api('/api/answer', { quizId: q.id, choice: i }); }
  catch { res = { ok: false, error: 'Could not reach SkillMe' }; }
  finally { view.busy = false; }
  if (!res.ok) { toast('icon-alert', esc(res.error || 'Could not submit')); mainKey = ''; return poll(); }
  const quiz = { ...q, status: 'answered', answer: res.answer, choice: res.choice, correct: res.correct, explanation: res.explanation, lesson: res.lesson, deepDive: res.deepDive || '' };
  view.result = { ...res, quiz };
  view.challengeOpen = false;
  view.showDeep = false;
  beep(res.correct ? 'right' : 'wrong');
  pendingInfo = { xp: res.xp }; // shown with the blow, which the next poll animates
  if (res.correct && res.scores.streak >= 3) setTimeout(() => confetti(80), 400);
  if (res.levelUp) setTimeout(() => levelUp(res.levelUp), 1400);
  mainKey = '';
  await poll();
  // The answered view is longer than the box: bring the verdict into view (only the quiz box scrolls).
  const v = $('#main .verdict');
  if (v) v.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function next() { view = { quizId: null, result: null, challengeOpen: false, draft: '', askDraft: '', showDeep: false }; mainKey = ''; render(); }

function review(id) {
  const q = S.history.find((h) => h.id === id);
  if (!q) return;
  view = { quizId: id, result: { review: true, quiz: { ...q } }, challengeOpen: false, draft: '', askDraft: '', showDeep: false };
  mainKey = ''; renderMain(); $('#main').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

      <h3 class="ui">${px('icon-hat')}Tutor</h3>
      <p>Answers your questions and judges your challenges, using OpenRouter. Each request sends the quiz and the code files it's about.</p>
      <div class="tstatus" id="tStatus"><i></i><span></span></div>
      <div><label class="lbl ui" for="tKey">OpenRouter API key</label>
        <div class="row"><input class="field mono" id="tKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-or-…"><button class="btn small primary ui" id="tSave">Save</button></div>
        <p id="tKeyInfo" style="margin-top:6px"></p></div>
      <div><label class="lbl ui" for="tModel">Model</label>
        <select class="field" id="tModel">${MODELS.map(([id, name]) => `<option value="${id}">${esc(name)}</option>`).join('')}<option value="custom">Other OpenRouter model…</option></select>
        <input class="field mono" id="tCustom" placeholder="vendor/model, e.g. google/gemini-3.8-flash" style="margin-top:6px" hidden></div>
      <p><a href="https://openrouter.ai/keys" target="_blank" rel="noopener noreferrer">Get a key at openrouter.ai</a></p>
    </section>
    <section>
      <h3 class="ui">${px('icon-chest')}Save data</h3>
      <label class="switch"><input type="checkbox" id="saveLocal"><span>Save this project's quiz data in its <code>.claude</code> folder</span></label>
      <p id="saveInfo"></p>
    </section>
    <section><h3 class="ui">${px('icon-pin')}Window</h3>
      ${inApp ? '<label class="switch"><input type="checkbox" id="pinToggle"><span>Keep this window on top</span></label>'
        : '<p>Play in a window of its own instead of a browser tab.</p><div id="appBox"></div>'}</section>
    <section><h3 class="ui">${px('icon-flag')}Status line</h3>
      <p>Claude Code only: shows the duel under your prompt. Add this line to <code>~/.claude/settings.json</code>:</p>
      <pre class="code slcode" id="slCmd"></pre>
      <div><button class="btn small ui" id="slCopy">${px('icon-scroll')}Copy</button></div></section>`;
  $('#menuClose').onclick = () => openMenu(false);
  $('#slCopy').onclick = async () => {
    try { await navigator.clipboard.writeText($('#slCmd').textContent); toast('icon-scroll', 'Copied. Paste it into ~/.claude/settings.json and restart Claude Code.'); }
    catch { toast('icon-alert', 'Could not copy: select the line and copy it yourself.'); }
  };
  $('#tSave').onclick = async () => {
    const key = $('#tKey').value.trim();
    if (!key) return $('#tKey').focus();
    const res = await api('/api/tutor', { openrouterKey: key });
    $('#tKey').value = '';
    if (!res.ok) return toast('icon-alert', esc(res.error || 'Could not save the key'));
    if (S) S.tutor = res.tutor;
    toast('icon-key', 'Key saved: every project, session and new chat on this computer uses it.');
    renderMenuState(); renderMenuDot(); mainKey = ''; poll();
  };
  $('#tKey').onkeydown = (e) => { if (e.key === 'Enter') $('#tSave').click(); };
  const saveModel = async (mdl) => {
    const res = await api('/api/tutor', { model: mdl });
    if (!res.ok) return toast('icon-alert', esc(res.error || 'Could not save the model'));
    if (S) S.tutor = res.tutor;
    renderMenuState(); renderMenuDot();
  };
  $('#tModel').onchange = () => {
    const v = $('#tModel').value;
    $('#tCustom').hidden = v !== 'custom';
    if (v === 'custom') return $('#tCustom').focus();
    saveModel(v);
  };
  $('#tCustom').onkeydown = (e) => { if (e.key === 'Enter' && $('#tCustom').value.trim()) saveModel($('#tCustom').value.trim()); };
  $('#tCustom').onblur = () => { if ($('#tCustom').value.trim()) saveModel($('#tCustom').value.trim()); };
  $('#saveLocal').onchange = async (e) => {
    const on = e.target.checked;
    const res = await api('/api/storage', { inProject: on });
    if (!res.ok) { e.target.checked = !on; return toast('icon-alert', esc(res.error || 'Could not move the data')); }
    toast('icon-chest', on ? "Quiz data now lives in this project's .claude/skillme folder." : 'Quiz data moved back to your SkillMe folder.');
    await poll();
  };
  if (inApp) {
    window.skillmeApp.getPinned().then((on) => ($('#pinToggle').checked = on)).catch(() => {});
    $('#pinToggle').onchange = async (e) => {
      const on = await window.skillmeApp.setPinned(e.target.checked);
      e.target.checked = on;
    };
  }
}

let appKey = '';
function renderAppBox() {
  const a = (S && S.app) || {};
  if (a.statusline && $('#slCmd')) $('#slCmd').textContent = `"statusLine": ${JSON.stringify({ type: 'command', command: a.statusline })}`;
  const box = $('#appBox');
  if (!box) return;
  const key = JSON.stringify([a.installed, a.installing, a.error, plainLook]);
  if (key === appKey && box.innerHTML) return;
  appKey = key;
  box.innerHTML = a.installed
    ? `<p>Installed: new quizzes open there from now on.</p><button class="btn small primary ui" id="appOpen">${px('icon-arrow')}Open the window</button>`
    : a.installing
      ? '<p>Installing the window app<span class="dots"></span> It is about 110 MB and takes a few minutes; keep playing here.</p>'
      : `<button class="btn small primary ui" id="appInstall">${px('icon-chest')}Install the window app</button>
         <p style="margin-top:6px">Downloads Electron ${esc(a.version || '')} (about 110 MB) once, into your SkillMe folder.</p>${a.error ? `<p style="color:var(--bad)">${esc(a.error)}</p>` : ''}`;
  if ($('#appInstall')) $('#appInstall').onclick = async () => {
    const res = await api('/api/app', { action: 'install' });
    if (S && res.app) S.app = res.app;
    toast('icon-chest', 'Downloading the window app. Keep playing here; it opens there from the next quiz on.');
    renderAppBox();
  };
  if ($('#appOpen')) $('#appOpen').onclick = async () => {
    const res = await api('/api/app', { action: 'open' });
    if (!res.ok) toast('icon-alert', esc(res.error || 'Could not open the window'));
  };
}

function renderMenuState() {
  renderAppBox();
  const t = (S && S.tutor) || {};
  $('#tStatus').className = 'tstatus' + (t.available ? ' ok' : '');
  $('#tStatus span').textContent = `${STATE_TEXT[t.state] || 'Unknown'}${t.model ? ' · ' + t.model : ''}`;
  $('#tKeyInfo').innerHTML = t.keySource === 'env' ? 'Using OPENROUTER_API_KEY from the environment.'
    : t.keySource === 'saved' ? 'Saved on this computer: every project, session and new chat uses it, so you never enter it again. <button class="linkbtn" id="tRemove">Remove it</button>'
    : 'Save it once: every project, session and new chat on this computer will use it. It stays on this computer, in your SkillMe folder.';
  $('#tKey').placeholder = t.keySource === 'saved' ? 'Saved (type a new key to replace it)' : 'sk-or-…';
  if ($('#tRemove')) $('#tRemove').onclick = async () => { const res = await api('/api/tutor', { openrouterKey: '' }); if (S && res.tutor) S.tutor = res.tutor; renderMenuState(); renderMenuDot(); };
  const sel = $('#tModel');
  if (document.activeElement !== sel && document.activeElement !== $('#tCustom') && t.model) {
    const known = MODELS.some(([id]) => id === t.model);
    sel.value = known ? t.model : 'custom';
    $('#tCustom').hidden = known;
    if (!known) $('#tCustom').value = t.model;
  }
  const st = (S && S.storage) || {};
  $('#saveLocal').checked = !!st.inProject;
  $('#saveInfo').innerHTML = st.inProject
    ? `Saved in <code>${esc(st.path)}</code> inside the project, so it moves with the project. It changes often, so you may want to add it to <code>.gitignore</code>.`
    : 'Saved in your SkillMe folder (<code>~/.skillme</code>). Turn this on to keep it with the project instead.';
}

function openMenu(show = true) {
  const m = $('#menu');
  if (!show) { m.hidden = true; return; }
  if (!m.innerHTML) buildMenu();
  m.hidden = false;
  renderMenuState();
  if (S && S.tutor && S.tutor.state === 'no_key') setTimeout(() => $('#tKey').focus(), 30);
}
$('#menuBtn').onclick = (e) => { e.stopPropagation(); openMenu($('#menu').hidden); };
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-open-menu]')) { e.stopPropagation(); openMenu(true); ($('.scroller') || window).scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (!$('#menu').hidden && !e.target.closest('#menu') && !e.target.closest('#menuBtn')) openMenu(false);
});
renderMenuDot();

function renderWelcome() {
  layoutKey = 'welcome';
  $('#app').innerHTML = `<div class="win welcome"><img src="${SPR('claude-dance-a')}" alt=""><h2 class="ui" style="margin:8px 0 6px">Welcome to the SkillMe Arena</h2>
    <p class="empty" style="max-width:520px;margin:0 auto">No duels yet. Start a coding session with your AI (Claude Code, Cursor, Codex…) with SkillMe installed:
    quizzes about the code it writes will pop up here while it works.</p></div>`;
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!$('#menu').hidden) return openMenu(false); const ov = $('.overlay'); if (ov) return ov.click(); const bd = $('.backdrop'); if (bd) return bd.remove(); }
  if (!S || ['TEXTAREA', 'INPUT', 'SELECT'].includes(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey || $('.backdrop')) return;
  const q = layoutKey === 'main' && currentQuiz();
  if (!q) return;
  if (!view.result) {
    const k = e.key.toUpperCase();
    const i = /^[1-4]$/.test(k) ? Number(k) - 1 : /^[A-D]$/.test(k) ? k.charCodeAt(0) - 65 : -1;
    if (i >= 0 && i < q.options.length) answer(q, i);
  } else if (e.key === 'Enter') next();
});

(async () => {
  try { HAVE = await (await fetch('/assets/sprites/manifest.json')).json(); } catch {}
  preloadArt();
  $('link[rel="icon"]').href = SPR('icon-player');
  poll();
})();
loadProjects();
setInterval(poll, 1500);
setInterval(loadProjects, 10000);
</script>
</body>
</html>
